# Configuración del Simulador Vivero.
# Opcional: copiar como config.toml en la carpeta del proyecto para cambiar valores por defecto.
# config.toml NO se sube a GitHub (está en .gitignore): ahí van las API keys.

proveedor = "open-meteo"          # "open-meteo" o "meteoblue"

[open_meteo]
api_key = ""                      # vacío = servicio gratuito (solo uso no comercial)
dias = 16                         # días de pronóstico (máximo 16)

[meteoblue]
api_key = ""

[red]
proxy = ""                        # normalmente vacío (requests usa el proxy del servidor)
timeout_s = 15

[cache]
vigencia_horas = 3                # reusar la última consulta del mismo punto durante este tiempo

[ubicacion]                       # punto por defecto al abrir la app
nombre = "Vivero Fray Bentos"
lat = -33.1295
lon = -58.1924
zoom = 16                         # acercamiento inicial del mapa

[grados_dia]                      # HIPÓTESIS SIN VALIDAR — calibrar con datos de altura
tb = 13.0                         # temperatura base, °C
tsup = 35.0                       # umbral superior (corte horizontal), °C
alerta_diaria = 18.0              # GD diario que dispara alerta
alerta_dias_consecutivos = 3
umbral_acumulado = 150.0          # referencia de manejo en la barra de progreso
