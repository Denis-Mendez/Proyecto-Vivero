<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Simulador Vivero{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand barra">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Simulador Vivero</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Pronóstico y ET₀</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path.startswith('/grados-dia') %}active{% endif %}" id="link-gd" href="/grados-dia">Grados día</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path.startswith('/alturas') %}active{% endif %}" href="/alturas">Alturas</a></li>
      </ul>
    </div>
  </nav>
  <main class="container-fluid py-3">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">v{{ version }} · Datos: Open-Meteo / meteoblue · Mapa © OpenStreetMap · ET₀ según FAO-56</footer>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
