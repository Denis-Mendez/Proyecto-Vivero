<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17954E">
  <title>{% block titulo %}Simulador Vivero · Montes del Plata{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/isotipo-mdp.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ version }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-fila">
      <a class="marca" href="/" aria-label="Simulador Vivero - inicio">
        <img src="{{ url_for('static', filename='img/logo-mdp-blanco.svg') }}" alt="Montes del Plata">
        <span class="marca-app">Simulador Vivero</span>
      </a>
      <nav class="menu" aria-label="Secciones">
        <a class="{% if request.path == '/' %}activo{% endif %}" href="/">Pronóstico y ET₀</a>
        <a class="{% if request.path.startswith('/grados-dia') %}activo{% endif %}" id="link-gd" href="/grados-dia">Grados día</a>
        <a class="{% if request.path.startswith('/alturas') %}activo{% endif %}" href="/alturas">Alturas</a>
      </nav>
    </div>
    <div class="franja"></div>
  </header>
  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">Montes del Plata · Vivero Fray Bentos · v{{ version }}<br>Datos: Open-Meteo · Mapa © OpenStreetMap · ET₀ según FAO-56</footer>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
